networks:
  vision_net:
    driver: bridge

services:
  nats:
    image: nats:latest
    command: "-js"
    ports:
      - "4223:4222"
      - "8223:8222"
    networks:
      - vision_net

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vigias
    ports:
      - "5436:5432"
    networks:
      - vision_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d vigias" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    networks:
      - vision_net

  router:
    build: ./router
    image: vigias-router
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=vigias
    ports:
      - "8003:8000" # Expose management API on host 8003
    networks:
      - vision_net
    depends_on:
      - nats
      - redis
    volumes:
      - ./evidence:/app/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ingest:
    build: ./ingest
    image: vigias-ingest
    environment:
      - NATS_URL=nats://nats:4222
      # Database Config
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=vigias
      # Pass through Hikvision credentials and config from .env
      - HIK_USER=${HIK_USER}
      - HIK_PASS=${HIK_PASS}
      - HIK_IP=${HIK_IP}
      - PORT_RTSP=${PORT_RTSP}
      - PORT_HTTP=${PORT_HTTP}
      # Ingest config
      - RESIZE_WIDTH=640
      - RESIZE_HEIGHT=360
      - TARGET_FPS=30.0
      - RTSP_TRANSPORT=${RTSP_TRANSPORT:-tcp}
    ports:
      - "8088:8080" # Metrics port
    networks:
      - vision_net
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  inference:
    build: ./inference
    image: vigias-inference
    volumes:
      - ./inference:/app/inference
      # Mount cache for models to avoid re-downloading
      - ./inference/models:/app/inference/models
      - ./inference/weights:/app/weights
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=vigias
      # Hikvision RTSP Auth (Replacements)
      - HIK_USER=${HIK_USER}
      - HIK_PASS=${HIK_PASS}
      - HIK_IP=${HIK_IP}
      - PORT_RTSP=${PORT_RTSP}
      # Face Cache Configuration (LFU Hybrid)
      - FACE_CACHE_ENABLED=true
      - FACE_CACHE_L1_CAPACITY=1000
      - SIMILARITY_THRESHOLD=0.85
      # Optimization - Enabled: TensorRT upgraded for Blackwell support
      - USE_TENSORRT=true
      - TENSORRT_PRECISION=fp16
      # Performance Tuning
      - BATCH_SIZE=1
      - BATCH_TIMEOUT=0.005
      # Qt headless mode (fixes Qt platform plugin crash)
      - QT_QPA_PLATFORM=offscreen
      # NVIDIA Support
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ipc: host
    # No need for symlinks with NGC container - everything is pre-configured
    ports:
      - "5005:5005"
      - "8007:8007"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - vision_net
    depends_on:
      - nats
      - redis
      - postgres

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9099:9090"
    networks:
      - vision_net

volumes:
  postgres_data:
