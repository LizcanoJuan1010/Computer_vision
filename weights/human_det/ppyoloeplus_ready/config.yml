# PPYOLOE-s Fine-tuning Configuration for Multi-Class Detection
# Classes: Person (1), Car (2), Motorcycle (3)
# Dataset: Merged MOT20 + Open Images

_BASE_: [
  '../PaddleDetection/configs/ppyoloe/_base_/optimizer_80e.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/ppyoloe_plus_crn.yml',
  '../PaddleDetection/configs/ppyoloe/_base_/ppyoloe_plus_reader.yml',
]

# Model configuration
weights: /workspace/pretrained/ppyoloe_plus_3class_init.pdparams
pretrain_weights: /workspace/pretrained/ppyoloe_plus_3class_init.pdparams
depth_mult: 0.33
width_mult: 0.50

# Multi-class configuration
num_classes: 3
classes: ['person', 'car', 'motorcycle']

# Dataset configuration
metric: COCO
TrainDataset:
  !COCODataSet
    image_dir: .
    anno_path: annotations/merged_train.json
    dataset_dir: /workspace/dataset
    data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  !COCODataSet
    image_dir: .
    anno_path: annotations/merged_train.json
    dataset_dir: /workspace/dataset
    allow_empty: true

TestDataset:
  !ImageFolder
    anno_path: annotations/merged_train.json

# Training hyperparameters
epoch: 30
LearningRate:
  base_lr: 0.001
  schedulers:
    - !CosineDecay
      max_epochs: 30
    - !LinearWarmup
      start_factor: 0.001
      epochs: 3

OptimizerBuilder:
  optimizer:
    momentum: 0.9
    weight_decay: 0.0005
  regularizer:
    factor: 0.0005
    type: L2

# Training settings
TrainReader:
  sample_transforms:
    - Decode: {}
    - RandomDistort: {}
    - RandomExpand: {fill_value: [123.675, 116.28, 103.53]}
    - RandomCrop: {}
    - RandomFlip: {}
  batch_transforms:
    - BatchRandomResize: {target_size: [320, 352, 384, 416, 448, 480, 512, 544, 576, 608, 640], random_size: True, random_interp: True, keep_ratio: False}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
    - PadGT: {}
  batch_size: 4
  shuffle: true
  drop_last: true
  use_shared_memory: true
  collate_batch: true

EvalReader:
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_size: 2

TestReader:
  inputs_def:
    image_shape: [3, 640, 640]
  sample_transforms:
    - Decode: {}
    - Resize: {target_size: [640, 640], keep_ratio: False, interp: 2}
    - NormalizeImage: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], is_scale: True}
    - Permute: {}
  batch_size: 1

# Architecture - PPYOLOE Small
architecture: PPYOLOE
PPYOLOE:
  backbone: CSPResNet
  neck: CustomCSPPAN
  yolo_head: PPYOLOEHead
  post_process: ~
  for_mot: false

CSPResNet:
  layers: [3, 6, 6, 3]
  channels: [64, 128, 256, 512, 1024]
  return_idx: [1, 2, 3]
  use_large_stem: true

CustomCSPPAN:
  out_channels: [768, 384, 192]
  stage_num: 1
  block_num: 3
  act: 'swish'
  spp: true

PPYOLOEHead:
  fpn_strides: [32, 16, 8]
  grid_cell_scale: 5.0
  grid_cell_offset: 0.5
  static_assigner_epoch: 4
  use_varifocal_loss: True
  loss_weight: {class: 1.0, iou: 2.5, dfl: 0.5}
  static_assigner:
    name: ATSSAssigner
    topk: 9
  assigner:
    name: TaskAlignedAssigner
    topk: 13
    alpha: 1.0
    beta: 6.0
  nms:
    name: MultiClassNMS
    nms_top_k: 1000
    keep_top_k: 100
    score_threshold: 0.01
    nms_threshold: 0.6

use_gpu: true
use_xpu: false
log_iter: 100
save_dir: /workspace/output
snapshot_epoch: 5
print_flops: false
