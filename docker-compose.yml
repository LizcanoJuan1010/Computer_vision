networks:
  vision_net:
    driver: bridge

services:
  nats:
    image: nats:latest
    restart: unless-stopped
    command: "-js"
    ports:
      - "4223:4222"
      - "8223:8222"
    networks:
      - vision_net
    healthcheck:
      test: [ "CMD", "nats-server", "-v" ] # Simple check if binary runs, or ping port
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vigias
    ports:
      - "5436:5432"
    networks:
      - vision_net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d vigias" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - vision_net

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    environment:
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
      - MTX_HLS=yes
      - MTX_HLSADDRESS=:8888
      - MTX_HLSALWAYSREMUX=yes
      - MTX_WEBRTC=yes
      - MTX_WEBRTCADDRESS=0.0.0.0:8889
      - MTX_READTIMEOUT=40s
      - MTX_WEBRTCADDITIONALHOSTS=127.0.0.1
      # Remove conflicting alias
    ports:
      - "8554:8554" # RTSP
      - "1935:1935" # RTMP
      - "8888:8888" # HLS
      - "8889:8889" # WebRTC (TCP Only)
      # - "8100-8120:8100-8120/udp" # WebRTC ICE/Media (UDP) - Disabled
      - "9997:9997" # API
    networks:
      - vision_net

  router:
    build: ./router
    image: vigias-router
    restart: unless-stopped
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=user
      - HIK_USER=${HIK_USER}
      - HIK_PASS=${HIK_PASS}
      - HIK_IP=${HIK_IP}
      - PORT_RTSP=${PORT_RTSP}
      - DB_PASSWORD=password
      - DB_NAME=vigias
      - MEDIAMTX_API=http://mediamtx:9997/v3/config/paths
    ports:
      - "8003:8000" # Expose management API on host 8003
    networks:
      - vision_net
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ./evidence:/app/evidence
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ingest:
    build: ./ingest
    image: vigias-ingest
    restart: unless-stopped
    environment:
      - NATS_URL=nats://nats:4222
      # Database Config
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=vigias
      # Pass through Hikvision credentials and config from .env
      - HIK_USER=${HIK_USER}
      - HIK_PASS=${HIK_PASS}
      - HIK_IP=${HIK_IP}
      - PORT_RTSP=${PORT_RTSP}
      - PORT_HTTP=${PORT_HTTP}
      # Ingest config
      - RESIZE_WIDTH=1280
      - RESIZE_HEIGHT=720
      - TARGET_FPS=30.0
      - RTSP_TRANSPORT=${RTSP_TRANSPORT:-udp}
    ports:
      - "8088:8080" # Metrics port
    networks:
      - vision_net
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy

  inference:
    build: ./inference
    image: vigias-inference
    restart: "no"  # Prevent cascade restarts - GPU issues shouldn't affect other services
    volumes:
      - ./inference:/app/inference
      # Mount cache for models to avoid re-downloading
      - ./inference/models:/app/inference/models
      - ./inference/weights:/app/weights
      - /etc/localtime:/etc/localtime:ro
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=vigias
      # Hikvision RTSP Auth (Replacements)
      - HIK_USER=${HIK_USER}
      - HIK_PASS=${HIK_PASS}
      - HIK_IP=${HIK_IP}
      - PORT_RTSP=${PORT_RTSP}
      # Face Cache Configuration (LFU Hybrid)
      - FACE_CACHE_ENABLED=true
      - FACE_CACHE_L1_CAPACITY=1000
      - SIMILARITY_THRESHOLD=0.85
      # Optimization - Enabled: TensorRT upgraded for Blackwell support
      - USE_TENSORRT=true
      - TENSORRT_PRECISION=fp16
      # Performance Tuning
      - BATCH_SIZE=1
      - BATCH_TIMEOUT=0.005
      # Qt headless mode (fixes Qt platform plugin crash)
      - QT_QPA_PLATFORM=offscreen
      # NVIDIA Support
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Bypass NVIDIA Container SM Version Check for Blackwell (50-series)
      - MAXSMVER=100
    ipc: host
    # No need for symlinks with NGC container - everything is pre-configured
    ports:
      - "5005:5005"
      - "8007:8007"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - vision_net
    depends_on:
      - nats
      - redis
      - postgres

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9099:9090"
    networks:
      - vision_net

volumes:
  postgres_data:
