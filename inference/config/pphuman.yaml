DET:
  model_dir: /app/weights/mot_ppyoloe_l_36e_pipeline
  batch_size: 1
  threshold: 0.2

ATTR:
  model_dir: /app/weights/PPLCNet_x1_0_person_attribute_945_infer
  batch_size: 1

SKELETON_ACTION:
  model_dir: /app/weights/STGCN
  enable: False
  max_frames: 50
  display_frames: 80
  coord_size: [384, 512]

# Smoking Detection configuration
ID_BASED_DETACTION:
  model_dir: /app/weights/ppyoloe_crn_s_80e_smoking_visdrone
  batch_size: 8
  threshold: 0.3
  display_frames: 80
  skip_frame_num: 2
  enable: False # Enabled dynamically in code

# Calling/Phoning Detection configuration
ID_BASED_CLSACTION:
  model_dir: /app/weights/PPHGNet_tiny_calling_halfbody
  batch_size: 8
  threshold: 0.8
  display_frames: 80
  skip_frame_num: 2
  enable: False # Enabled dynamically in code

  # FALTA ESTO PARA PELEAS
VIDEO_ACTION:
  model_dir: /app/weights/pptsm_fight_detection  # Modelo específico de peleas
  batch_size: 1
  enable: False
  frame_len: 8   # Cuantos frames analiza para decidir si es pelea
  sample_freq: 4 # Cada cuanto toma un frame

# FALTA ESTO PARA FORENSE (REID)
REID:
  model_dir: /app/weights/reid_model # Modelo que convierte la imagen de la persona en vectores matemáticos únicos
  batch_size: 16
  enable: False
